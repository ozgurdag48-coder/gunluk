<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev ve Mesai Raporlama Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f5f7fa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        button { background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #2ecc71; margin-top: 10px; }
        .btn-secondary:hover { background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-msg { margin-top: 10px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; display: block; }
        .error { background-color: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Yeni Görev / Rapor Ekle</h2>
    <div id="mesajKutusu" class="status-msg"></div>
    
    <form id="kayitFormu" onsubmit="kayitEkle(event)">
        <div class="form-group">
            <label for="tarih">Tarih:</label>
            <input type="date" id="tarih" required>
        </div>
        <div class="form-group">
            <label for="katilimci">Katılımcı Seçin:</label>
            <select id="katilimci" required>
                <option value="">Seçiniz...</option>
                <option value="Mehmet Kuzu">Mehmet Kuzu</option>
                <option value="Kayhan Sezgin">Kayhan Sezgin</option>
                <option value="Özgür Türkkal">Özgür Türkkal</option>
                <option value="Mustafa Adışanlı">Mustafa Adışanlı</option>
                <option value="ÖZGÜR DAĞ">ÖZGÜR DAĞ</option>
            </select>
        </div>
        <div class="form-group">
            <label for="yapilanIs">Yapılan İş / Görev Detayı:</label>
            <textarea id="yapilanIs" placeholder="Bugün neler yapıldığını detaylıca yazın..." required></textarea>
        </div>
        <div class="form-group">
            <label for="mesaiDurumu">Mesai Kalındı mı?</label>
            <select id="mesaiDurumu" required>
                <option value="Hayır">Hayır</option>
                <option value="Evet">Evet</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mesaiDetayi">Mesai Detayı (Kalan saat veya açıklama):</label>
            <input type="text" id="mesaiDetayi" placeholder="Örn: 2 saat kalındı, arıza giderildi (Yoksa boş bırakın)">
        </div>
        <button type="submit">Raporu Kaydet</button>
    </form>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ccc;">

    <h3>Kayıtlı Tüm Raporlar</h3>
    <button onclick="raporlariGetir()" class="btn-secondary">E-Tablodan Güncel Raporları Çek</button>
    
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Sistem ID</th>
                    <th>Tarih</th>
                    <th>Katılımcı</th>
                    <th>Yapılan İş</th>
                    <th>Mesai</th>
                    <th>Mesai Detayı</th>
                </tr>
            </thead>
            <tbody id="tabloGovdesi">
                <tr>
                    <td colspan="6" style="text-align:center; color:#7f8c8d;">Henüz veri çekilmedi. Listelemek için yukarıdaki yeşil butonuna basın.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ KENDİ WEB UYGULAMASI URL ADRESİNİZİ AŞAĞIDAKİ ALANA YAPIŞTIRIN (Sonu /exec ile bitmeli):
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-s_JHoi-CiBWySLi4DFVy12o2LnKO-Q3uESQdAibvEvomjgySxFBW1Lp7M-UEvng6/exec";

    // 1. FONKSİYON: GOOGLE E-TABLOYA VERİ YAZMA (URL-Encoded Formatı ile Eksiksiz Aktarım)
    function kayitEkle(event) {
        event.preventDefault();
        const mesajKutusu = document.getElementById("mesajKutusu");
        mesajKutusu.className = "status-msg";
        mesajKutusu.innerText = "Kayıt e-tabloya işleniyor...";
        mesajKutusu.style.display = "block";

        // Google'ın no-cors modunda veriyi bölmeden, eksiksiz okumasını sağlayan güvenli URL parametre yapısı:
        const formVerileri = new URLSearchParams();
        formVerileri.append("id", "ID-" + Math.floor(Math.random() * 100000));
        formVerileri.append("tarih", document.getElementById("tarih").value);
        formVerileri.append("katilimci", document.getElementById("katilimci").value);
        formVerileri.append("yapilanIs", document.getElementById("yapilanIs").value);
        formVerileri.append("mesaiDurumu", document.getElementById("mesaiDurumu").value);
        formVerileri.append("mesaiDetayi", document.getElementById("mesaiDetayi").value || "-");

        fetch(GOOGLE_APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formVerileri.toString()
        })
        .then(() => {
            mesajKutusu.className = "status-msg success";
            mesajKutusu.innerText = "Başarıyla Kaydedildi! Tüm veriler e-tabloya eksiksiz aktarıldı.";
            document.getElementById("kayitFormu").reset();
            
            // Kullanıcı konforu için 1.5 saniye sonra rapor tablosunu otomatik olarak yeniler
            setTimeout(raporlariGetir, 1500);
        })
        .catch(error => {
            console.error("Hata:", error);
            mesajKutusu.className = "status-msg error";
            mesajKutusu.innerText = "Veri gönderilirken bir bağlantı hatası oluştu!";
        });
    }

    // 2. FONKSİYON: GOOGLE E-TABLODAN DOĞRUDAN VERİ ÇEKME (Filtresiz Net Listeleme)
    function raporlariGetir() {
        const tabloGovdesi = document.getElementById("tabloGovdesi");
        tabloGovdesi.innerHTML = '<tr><td colspan="6" style="text-align:center;">E-tablo taranıyor, veriler yükleniyor...</td></tr>';

        fetch(GOOGLE_APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            console.log("E-Tablodan Çekilen Veriler:", data);
            
            if (!data || data.length === 0 || data.error) {
                tabloGovdesi.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#c0392b; font-weight:bold;">E-tabloda okunabilir hiçbir kayıt bulunamadı! Başlık satırını kontrol edin.</td></tr>';
                return;
            }

            let htmlContent = "";
            // E-tablodaki başlık isimlerine bağımlı kalmamak için nesne anahtarlarını (keys) dinamik çözüyoruz
            data.forEach(satir => {
                const keys = Object.keys(satir);
                
                htmlContent += `<tr>
                    <td>${satir[keys[0]] || '-'}</td>
                    <td>${satir[keys[1]] || '-'}</td>
                    <td>${satir[keys[2]] || '-'}</td>
                    <td>${satir[keys[3]] || '-'}</td>
                    <td>${satir[keys[4]] || '-'}</td>
                    <td>${satir[keys[5]] || '-'}</td>
                </tr>`;
            });

            tabloGovdesi.innerHTML = htmlContent;
        })
        .catch(error => {
            console.error("Hata:", error);
            tabloGovdesi.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#c0392b; font-weight:bold;">Bağlantı hatası: Veriler alınamadı. Apps Script web uygulamasının erişim iznini "Herkes" (Anyone) olarak güncellediğinizden emin olun.</td></tr>';
        });
    }
</script>

</body>
</html>
