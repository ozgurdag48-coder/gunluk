<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günlük Görev Yönetimi</title>
    <style>
        /* Mevcut tasarımsal CSS kodlarınız */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        .btn { padding: 10px 15px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div id="kayit-alani">
        <h2>Yeni Görev Kaydı</h2>
        <form id="gorevFormu">
            <div class="form-group">
                <label for="personel">Personel:</label>
                <select id="personel" name="personel" required>
                    <option value="Mehmet Kuzu">Mehmet Kuzu</option>
                    <option value="Kayhan Sezgin">Kayhan Sezgin</option>
                    <option value="Özgür Türkkal">Özgür Türkkal</option>
                    <option value="Mustafa Adışanlı">Mustafa Adışanlı</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gorev">Yapılan İş / Görev:</label>
                <textarea id="gorev" name="gorev" required></textarea>
            </div>
            <button type="submit" class="btn">Kaydet</button>
        </form>
    </div>

    <hr>

    <div id="rapor-alani">
        <h2>Raporlama Sayfası</h2>
        <div class="form-group">
            <label for="raporTarihi">Tarih Seçin:</label>
            <input type="date" id="raporTarihi" required>
        </div>
        <button id="btnRaporAl" class="btn">Rapor Al</button>

        <table id="raporTablosu" style="display:none;">
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Personel</th>
                    <th>Yapılan İş / Görev</th>
                </tr>
            </thead>
            <tbody id="raporGövdesi">
                </tbody>
        </table>
        <p id="raporMesaj" style="margin-top: 15px; color: gray;"></p>
    </div>

    <script>
        // CAN ALICI NOKTA: Google Apps Script Web Uygulaması URL'nizi buraya yapıştırın
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-s_JHoi-CiBWySLi4DFVy12o2LnKO-Q3uESQdAibvEvomjgySxFBW1Lp7M-UEvng6/exec"; 

        // --- 1. GOOGLE E-TABLOYA KAYIT GÖNDERME ---
        document.getElementById('gorevFormu').addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engeller

            const personel = document.getElementById('personel').value;
            const gorev = document.getElementById('gorev').value;
            const tarih = new Date().toISOString().split('T')[0]; // Otomatik bugünün tarihi (YYYY-MM-DD)

            // Gönderilecek veri objesi
            const veri = {
                action: "kayitEkle",
                tarih: tarih,
                personel: personel,
                gorev: gorev
            };

            // Butonu geçici olarak devre dışı bırakalım
            const submitBtn = e.target.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = "Kaydediliyor...";

            // Veriyi Google Sheets'e POST etme
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // CORS hatasını engellemek için (no-cors modunda yanıt detayları okunamaz ama veri gider)
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(veri)
            })
            .then(() => {
                alert("Kayıt başarıyla Google E-Tabloya eklendi!");
                document.getElementById('gorevFormu').reset();
            })
            .catch(error => {
                console.error("Hata:", error);
                alert("Kayıt sırasında bir hata oluştu.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kaydet";
            });
        });

        // --- 2. GOOGLE E-TABLODAN TARİHE GÖRE RAPOR ÇEKME ---
        document.getElementById('btnRaporAl').addEventListener('click', function() {
            const secilenTarih = document.getElementById('raporTarihi').value;
            
            if (!secilenTarih) {
                alert("Lütfen önce bir tarih seçiniz.");
                return;
            }

            const raporGövdesi = document.getElementById('raporGövdesi');
            const raporTablosu = document.getElementById('raporTablosu');
            const raporMesaj = document.getElementById('raporMesaj');

            // Temizlik ve Yükleniyor durumu
            raporGövdesi.innerHTML = "";
            raporTablosu.style.display = "none";
            raporMesaj.innerText = "Veriler çekiliyor, lütfen bekleyin...";

            // Veriyi getirmek için GET isteği (Tarih parametresi ile birlikte)
            fetch(`${WEB_APP_URL}?action=raporGetir&tarih=${secilenTarih}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    // Gelen verileri tabloya satır satır ekle
                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.tarih}</td>
                            <td>${item.personel}</td>
                            <td>${item.gorev}</td>
                        `;
                        raporGövdesi.appendChild(row);
                    });
                    raporTablosu.style.display = "table";
                    raporMesaj.innerText = `${data.length} adet kayıt bulundu.`;
                } else {
                    raporMesaj.innerText = "Seçilen tarihe ait hiçbir kayıt bulunamadı.";
                }
            })
            .catch(error => {
                console.error("Rapor çekme hatası:", error);
                raporMesaj.innerText = "Veri çekilirken bir hata oluştu. Lütfen Apps Script kodunuzu ve URL'nizi kontrol edin.";
            });
        });
    </script>
</body>
</html>
