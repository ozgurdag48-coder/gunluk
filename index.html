<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev ve Mesai Raporlama Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { color: #2c3e50; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #edf2f7; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-weight: 600; margin-bottom: 8px; color: #4a5568; font-size: 14px; }
        input, select, textarea { padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; transition: border-color 0.2s; background-color: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
        textarea { resize: vertical; min-height: 100px; }
        .btn-group { display: flex; gap: 15px; margin-top: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: #3182ce; color: white; }
        .btn-primary:hover { background-color: #2b6cb0; }
        .btn-success { background-color: #38a169; color: white; }
        .btn-success:hover { background-color: #2f855a; }
        
        /* Orijinal Klasik Tablo Tasarımı */
        .table-container { overflow-x: auto; margin-top: 25px; border: 1px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; background-color: #fff; }
        th { background-color: #2d3748; color: white; padding: 14px; font-size: 14px; font-weight: 600; }
        td { padding: 14px; border-bottom: 1px solid #e2e8f0; color: #4a5568; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: #f7fafc; }
        
        /* Durum Bildirimleri */
        .alert { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: 500; display: none; animation: fadeIn 0.3s; }
        .alert-success { background-color: #c6f6d5; color: #22543d; border-left: 5px solid #38a169; }
        .alert-error { background-color: #fed7d7; color: #742a2a; border-left: 5px solid #e53e3e; }
        .alert-info { background-color: #ebf8ff; color: #2b6cb0; border-left: 5px solid #3182ce; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Yeni Görev / Rapor Giriş Paneli</h2>
    
    <!-- Bildirim Ekranı -->
    <div id="bildirimKutusu" class="alert"></div>
    
    <form id="raporFormu" onsubmit="veriKaydet(event)">
        <div class="form-grid">
            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" required>
            </div>
            
            <div class="form-group">
                <label for="katilimci">Personel / Katılımcı</label>
                <select id="katilimci" required>
                    <option value="">Seçiniz...</option>
                    <option value="Mehmet Kuzu">Mehmet Kuzu</option>
                    <option value="Kayhan Sezgin">Kayhan Sezgin</option>
                    <option value="Özgür Türkkal">Özgür Türkkal</option>
                    <option value="Mustafa Adışanlı">Mustafa Adışanlı</option>
                    <option value="ÖZGÜR DAĞ">ÖZGÜR DAĞ</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mesaiDurumu">Mesai Durumu</label>
                <select id="mesaiDurumu" required onchange="mesaiAlaniniYonet()">
                    <option value="Hayır">Mesai Kalınmadı</option>
                    <option value="Evet">Mesai Kalındı</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mesaiDetayi">Mesai Açıklaması / Süresi</label>
                <input type="text" id="mesaiDetayi" placeholder="Örn: 2 saat (Yoksa boş bırakın)" disabled>
            </div>
            
            <div class="form-group full-width">
                <label for="yapilanIs">Yapılan İş ve Görev Detayları</label>
                <textarea id="yapilanIs" placeholder="Gün içinde tamamlanan projeler, arıza müdahaleleri ve teknik çalışmalar..." required></textarea>
            </div>
        </div>
        
        <div class="btn-group">
            <button type="submit" class="btn-primary">Raporu Gönder</button>
            <button type="button" onclick="raporlariListele()" class="btn-success">Listeyi Yenile / Rapor Al</button>
        </div>
    </form>

    <div style="margin-top: 40px;">
        <h3>Sistemdeki Güncel Görev Listesi</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 12%;">Sistem ID</th>
                        <th style="width: 13%;">Tarih</th>
                        <th style="width: 18%;">Personel</th>
                        <th>Yapılan İş / Görev Açıklaması</th>
                        <th style="width: 12%;">Mesai</th>
                        <th style="width: 15%;">Mesai Detayı</th>
                    </tr>
                </thead>
                <tbody id="tabloBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #718096; padding: 20px;">Henüz listeleme yapılmadı. Verileri senkronize etmek için yukarıdaki yeşil butona basın.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // İlettiğiniz güncel Google Apps Script Web App URL adresi
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-s_JHoi-CiBWySLi4DFVy12o2LnKO-Q3uESQdAibvEvomjgySxFBW1Lp7M-UEvng6/exec";

    // Giriş alanlarını dinamik kilitler/açar
    function mesaiAlaniniYonet() {
        const durum = document.getElementById("mesaiDurumu").value;
        const detayInput = document.getElementById("mesaiDetayi");
        if (durum === "Evet") {
            detayInput.disabled = false;
            detayInput.required = true;
            detayInput.focus();
        } else {
            detayInput.disabled = true;
            detayInput.required = false;
            detayInput.value = "";
        }
    }

    function mesajGoster(metin, tip) {
        const kutu = document.getElementById("bildirimKutusu");
        kutu.className = "alert alert-" + tip;
        kutu.innerText = metin;
        kutu.style.display = "block";
    }

    // 1. İŞLEM: VERİ YAZMA (E-Tabloya Ekleme)
    function veriKaydet(event) {
        event.preventDefault();
        mesajGoster("Rapor e-tabloya güvenli bir şekilde işleniyor, lütfen bekleyin...", "info");

        const veri = {
            id: "ID-" + Math.floor(10000 + Math.random() * 90000),
            tarih: document.getElementById("tarih").value,
            katilimci: document.getElementById("katilimci").value,
            yapilanIs: document.getElementById("yapilanIs").value,
            mesaiDurumu: document.getElementById("mesaiDurumu").value,
            mesaiDetayi: document.getElementById("mesaiDetayi").value || "-"
        };

        // Arka planda verilerin eksiksiz, kaymadan sırayla gönderilmesini sağlayan kararlı yapı
        fetch(GOOGLE_APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(veri)
        })
        .then(() => {
            mesajGoster("Kayıt başarıyla tamamlandı! E-tabloya eksiksiz ve doğru sütunlarla işlendi.", "success");
            document.getElementById("raporFormu").reset();
            mesaiAlaniniYonet();
            setTimeout(raporlariListele, 1200); // E-tablonun yazma hızına göre ufak güvenli bekleme sonrası listeleme
        })
        .catch(error => {
            console.error(error);
            mesajGoster("Sistemsel bir bağlantı hatası oluştu. Apps Script izinlerinizi veya linkinizi kontrol edin.", "error");
        });
    }

    // 2. İŞLEM: VERİ OKUMA VE LİSTELEME
    function raporlariListele() {
        const tBody = document.getElementById("tabloBody");
        tBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #2b6cb0;">E-tablodan veriler canlı senkronize ediliyor...</td></tr>';

        fetch(GOOGLE_APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            if (!data || data.length === 0 || data.error) {
                tBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e53e3e; font-weight: bold;">E-tabloda geçerli hiçbir veri satırı bulunamadı!</td></tr>';
                return;
            }

            let rowsHtml = "";
            // Herhangi bir başlık kayması/filtre hatası olmadan ham hücre verilerini temizce basar
            data.forEach(satir => {
                const anahtarlar = Object.keys(satir);
                rowsHtml += `<tr>
                    <td><strong>${satir[anahtarlar[0]] || '-'}</strong></td>
                    <td>${satir[anahtarlar[1]] || '-'}</td>
                    <td>${satir[anahtarlar[2]] || '-'}</td>
                    <td>${satir[anahtarlar[3]] || '-'}</td>
                    <td>${satir[anahtarlar[4]] || '-'}</td>
                    <td>${satir[anahtarlar[5]] || '-'}</td>
                </tr>`;
            });
            tBody.innerHTML = rowsHtml;
        })
        .catch(err => {
            console.error(err);
            tBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e53e3e; font-weight: bold;">Veri çekme hatası. Lütfen daha sonra tekrar deneyin.</td></tr>';
        });
    }
</script>

</body>
</html>
