<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günlük İş Kayıt ve Raporlama Sistemi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #f5f7fb;
            color: #333;
            height: 100vh;
            overflow: hidden;
            flex-direction: row;
        }

        /* Sol Menü / Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .sidebar-title {
            padding: 0 20px 20px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 15px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            background-color: #334155;
            color: #fff;
        }

        .menu-btn.active {
            background-color: #3b82f6;
            color: #fff;
            font-weight: 600;
        }

        /* Ana İçerik Alanı */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            height: 100vh;
        }

        /* Sayfa Düzeni */
        .page {
            display: none;
            width: 100%;
            max-width: 100%;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .page.active {
            display: block;
        }

        h2 {
            margin-bottom: 30px;
            color: #0f172a;
            font-size: 26px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        /* Form Elemanları */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #475569;
            font-size: 15px;
        }

        input[type="date"],
        select,
        textarea,
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            color: #334155;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 150px; 
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* Checkbox Alanı */
        .checkbox-group {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            cursor: pointer;
            user-select: none;
            padding: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        /* Dinamik Açılan Mesai Alanı */
        .mesai-container {
            display: none;
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3b82f6;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Butonlar */
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .btn-success {
            background-color: #10b981;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        /* Raporlama Filtre Paneli */
        .filter-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        /* Tablo Tasarımı */
        .table-responsive {
            overflow-x: auto;
            margin-top: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        td:nth-child(3) {
            min-width: 250px;
            max-width: 600px;
            word-break: break-word;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-yes { background-color: #d1fae5; color: #065f46; }
        .badge-no { background-color: #f1f5f9; color: #475569; }

        /* Bildirim Kutusu */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 18px 30px;
            background-color: #10b981;
            color: white;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Mobil ve Tablet Uyumluluk Ayarları */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                padding: 10px;
                align-items: center;
                justify-content: space-between;
            }

            .sidebar-title {
                display: none;
            }

            .menu-btn {
                padding: 12px;
                text-align: center;
                justify-content: center;
                font-size: 14px;
                border-radius: 6px;
                width: 48%;
            }

            .main-content {
                padding: 15px;
                height: calc(100vh - 60px);
            }

            .page {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .filter-panel {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
                padding: 15px;
            }

            .filter-group {
                min-width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">İŞ TAKİP PANELİ</div>
        <button class="menu-btn active" onclick="switchPage('kayit-sayfasi', this)">
            📝 Günlük İş Kaydı
        </button>
        <button class="menu-btn" onclick="switchPage('rapor-sayfasi', this); listeleRapor();">
            📊 Raporlama
        </button>
    </div>

    <div class="main-content">
        
        <div id="notification" class="notification">İşlem başarıyla kaydedildi!</div>

        <div id="kayit-sayfasi" class="page active">
            <h2>Günlük İş Kaydı Formu</h2>
            <form id="isKayitFormu" onsubmit="kaydetVeri(event)">
                
                <div class="form-group">
                    <label for="isTarihi">Tarih</label>
                    <input type="date" id="isTarihi" required>
                </div>

                <div class="form-group">
                    <label for="katilimci">Katılımcı Seçimi</label>
                    <select id="katilimci" required>
                        <option value="">-- Personel Seçiniz --</option>
                        <option value="ÖZGÜR DAĞ">ÖZGÜR DAĞ</option>
                        <option value="ÖZGÜR TÜRKKAL">ÖZGÜR TÜRKKAL</option>
                        <option value="MUSTAFA ADIŞANLI">MUSTAFA ADIŞANLI</option>
                        <option value="MEHMET KUZU">MEHMET KUZU</option>
                        <option value="KAYHAN SEZGİN">KAYHAN SEZGİN</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="isAciklama">Yapılan İş Açıklaması</label>
                    <textarea id="isAciklama" placeholder="Bugün gerçekleştirilen faaliyetleri detaylandırın..." required></textarea>
                </div>

                <div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="mesaiKaldı" onchange="toggleMesaiAlani()">
                        <label for="mesaiKaldı" style="margin-bottom: 0; cursor: pointer;">Mesaiye Kalındı mı?</label>
                    </div>
                </div>

                <div id="mesaiDetayPanel" class="mesai-container">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="mesaiSureAciklama">Mesai Süresi ve Açıklaması</label>
                        <input type="text" id="mesaiSureAciklama" placeholder="Örn: 2 Saat - Raporlama ve sunum hazırlığı yapıldı">
                    </div>
                </div>

                <div style="margin-top: 35px;">
                    <button type="submit" class="btn">💾 Kaydet</button>
                </div>
            </form>
        </div>

        <div id="rapor-sayfasi" class="page">
            <h2>Raporlama ve Analiz</h2>
            
            <div class="filter-panel">
                <div class="filter-group">
                    <label for="filtreTipi">Rapor Periyodu</label>
                    <select id="filtreTipi" onchange="filtreGuncelle()">
                        <option value="gunluk">Günlük Rapor</option>
                        <option value="aylik">Aylık Rapor</option>
                        <option value="tum">Tüm Kayıtlar</option>
                    </select>
                </div>
                <div class="filter-group" id="tarihFiltreGrup">
                    <label id="tarihLabel" for="filtreTarih">Tarih Seçimi</label>
                    <input type="date" id="filtreTarih" onchange="listeleRapor()">
                </div>
                <div>
                    <button class="btn btn-success" onclick="raporuDisaAktar()">📥 Raporu Dışa Aktar</button>
                </div>
            </div>

            <div class="table-responsive">
                <table id="raporTablosu">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Katılımcı</th>
                            <th style="width: 45%;">Yapılan İş</th>
                            <th>Mesai</th>
                            <th>Mesai Detayı</th>
                        </tr>
                    </thead>
                    <tbody id="raporDataBody">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Bugünün tarihini varsayılan atama
        document.getElementById('isTarihi').valueAsDate = new Date();
        document.getElementById('filtreTarih').valueAsDate = new Date();

        function getDatabase() {
            const db = localStorage.getItem('isTakipDB');
            return db ? JSON.parse(db) : [];
        }

        function saveDatabase(data) {
            localStorage.setItem('isTakipDB', JSON.stringify(data));
        }

        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        function toggleMesaiAlani() {
            const checkbox = document.getElementById('mesaiKaldı');
            const detayPanel = document.getElementById('mesaiDetayPanel');
            const detayInput = document.getElementById('mesaiSureAciklama');

            if(checkbox.checked) {
                detayPanel.style.display = 'block';
                detayInput.setAttribute('required', 'required');
            } else {
                detayPanel.style.display = 'none';
                detayInput.removeAttribute('required');
                detayInput.value = '';
            }
        }

        function kaydetVeri(event) {
            event.preventDefault();

            const tarih = document.getElementById('isTarihi').value;
            const katilimci = document.getElementById('katilimci').value;
            const isAciklama = document.getElementById('isAciklama').value;
            const mesaiKalindi = document.getElementById('mesaiKaldı').checked;
            const mesaiDetay = document.getElementById('mesaiSureAciklama').value;

            const yeniKayit = {
                id: Date.now(),
                tarih: tarih,
                katilimci: katilimci,
                isAciklama: isAciklama,
                mesaiKalindi: mesaiKalindi,
                mesaiDetay: mesaiKalindi ? mesaiDetay : '-'
            };

            const db = getDatabase();
            db.push(yeniKayit);
            saveDatabase(db);

            document.getElementById('isKayitFormu').reset();
            document.getElementById('isTarihi').valueAsDate = new Date();
            document.getElementById('mesaiDetayPanel').style.display = 'none';
            document.getElementById('mesaiSureAciklama').removeAttribute('required');

            showNotification();
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }

        function filtreGuncelle() {
            const filtreTipi = document.getElementById('filtreTipi').value;
            const filtreTarih = document.getElementById('filtreTarih');
            const tarihFiltreGrup = document.getElementById('tarihFiltreGrup');
            const tarihLabel = document.getElementById('tarihLabel');

            if (filtreTipi === 'tum') {
                tarihFiltreGrup.style.display = 'none';
            } else {
                tarihFiltreGrup.style.display = 'block';
                if (filtreTipi === 'gunluk') {
                    tarihLabel.innerText = "Tarih Seçimi";
                    filtreTarih.type = "date";
                    filtreTarih.valueAsDate = new Date();
                } else if (filtreTipi === 'aylik') {
                    tarihLabel.innerText = "Ay Seçimi";
                    filtreTarih.type = "month";
                    const bugun = new Date();
                    const ay = String(bugun.getMonth() + 1).padStart(2, '0');
                    filtreTarih.value = bugun.getFullYear() + "-" + ay;
                }
            }
            listeleRapor();
        }

        function listeleRapor() {
            const db = getDatabase();
            const filtreTipi = document.getElementById('filtreTipi').value;
            const filtreTarihDeger = document.getElementById('filtreTarih').value;
            const tbody = document.getElementById('raporDataBody');
            
            tbody.innerHTML = '';
            db.sort((a, b) => new Date(b.tarih) - new Date(a.tarih));

            const filtrelenmişVeri = db.filter(kayit => {
                if (filtreTipi === 'tum') return true;
                if (!filtreTarihDeger) return true;
                
                if (filtreTipi === 'gunluk') {
                    return kayit.tarih === filtreTarihDeger;
                } else if (filtreTipi === 'aylik') {
                    return kayit.tarih.startsWith(filtreTarihDeger);
                }
                return true;
            });

            if (filtrelenmişVeri.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 30px;">Kayıtlı veri bulunamadı.</td></tr>`;
                return;
            }

            filtrelenmişVeri.forEach(kayit => {
                const tr = document.createElement('tr');
                const parca = kayit.tarih.split('-');
                const formatliTarih = parca.length === 3 ? `${parca[2]}.${parca[1]}.${parca[0]}` : kayit.tarih;

                tr.innerHTML = `
                    <td><b>${formatliTarih}</b></td>
                    <td>${kayit.katilimci}</td>
                    <td>${kayit.isAciklama}</td>
                    <td><span class="badge ${kayit.mesaiKalindi ? 'badge-yes' : 'badge-no'}">${kayit.mesaiKalindi ? 'Evet' : 'Hayır'}</span></td>
                    <td>${kayit.mesaiDetay}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function raporuDisaAktar() {
            const db = getDatabase();
            if(db.length === 0) {
                alert("Dışa aktarılacak veri bulunamadı.");
                return;
            }

            let csvContent = "\uFEFF"; 
            csvContent += "Tarih;Katilimci;Yapilan Is;Mesai Durumu;Mesai Detayi\n";

            const filtreTipi = document.getElementById('filtreTipi').value;
            const filtreTarihDeger = document.getElementById('filtreTarih').value;

            const filtrelenmişVeri = db.filter(kayit => {
                if (filtreTipi === 'tum') return true;
                if (!filtreTarihDeger) return true;
                if (filtreTipi === 'gunluk') return kayit.tarih === filtreTarihDeger;
                if (filtreTipi === 'aylik') return kayit.tarih.startsWith(filtreTarihDeger);
                return true;
            });

            filtrelenmişVeri.forEach(kayit => {
                const temizIs = kayit.isAciklama.replace(/;/g, ',').replace(/\n/g, ' ');
                const temizMesaiDetay = kayit.mesaiDetay.replace(/;/g, ',').replace(/\n/g, ' ');
                const mesaiMetin = kayit.mesaiKalindi ? "Evet" : "Hayir";

                csvContent += `${kayit.tarih};${kay
